<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLEO Explorer</title>
  <meta name="description" content="Browse the PSA-RE DBMUXEv database: Peugeot / Citroën / DS CAN, VAN and LIN frames, ECUs, cars and diagnostics, with decoders, encoders and code generators.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f7dd1'/%3E%3Cpath d='M5 11h22M5 21h22' stroke='%23fff' stroke-width='2.5'/%3E%3Crect x='9' y='7' width='6' height='8' rx='1' fill='%23ffb703'/%3E%3Crect x='18' y='17' width='6' height='8' rx='1' fill='%2390be6d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/frames" title="OpenLEO Explorer">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#2f7dd1"/><path d="M5 11h22M5 21h22" stroke="#fff" stroke-width="2.5"/><rect x="9" y="7" width="6" height="8" rx="1" fill="#ffb703"/><rect x="18" y="17" width="6" height="8" rx="1" fill="#90be6d"/></svg>
      <span>OpenLeo <b>Explorer</b></span>
    </a>
    <nav id="tabs" class="tabs">
      <a href="#/arch" data-view="arch">Architectures</a>
      <a href="#/cars" data-view="cars">Cars</a>
      <a href="#/frames" data-view="frames">Frames</a>
      <a href="#/ecus" data-view="ecus">ECUs</a>
      <a href="#/diag" data-view="diag">Diagnostics</a>
      <a href="#/tools" data-view="tools">Tools</a>
      <a href="#/about" data-view="about">About</a>
    </nav>
    <div class="searchbox">
      <input id="gsearch" type="search" placeholder="Search: 036, BSI_COMMANDS, BSI, A70…  ( / )" autocomplete="off" spellcheck="false" aria-label="Global search">
      <div id="search-dd" class="search-dd" hidden></div>
    </div>
    <div class="topctl">
      <span id="status" class="status"></span>
      <select id="lang" title="Content language (falls back to en, then fr)" aria-label="Content language"></select>
      <button id="refresh-btn" class="iconbtn" title="Reload the data, bypassing the cache">⟳</button>
      <a href="#/settings" class="iconbtn" title="Data sources &amp; settings" data-view="settings">⚙</a>
      <button id="theme-btn" class="iconbtn" title="Theme">◐</button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="loading" class="loading" hidden></div>
  <noscript><div class="page"><p>OpenLEO Explorer needs JavaScript (ES modules).</p></div></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
